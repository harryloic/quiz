<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>云网融合初级复习</title>
<style>
:root{--primary:#4A90D9;--primary-light:#E8F1FB;--primary-dark:#3A7BC8;--correct:#52C41A;--correct-bg:#F6FFED;--wrong:#FF4D4F;--wrong-bg:#FFF2F0;--text:#333;--text-secondary:#888;--border:#E8E8E8;--bg:#F5F7FA;--card-bg:#FFF;--shadow:0 2px 8px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--primary);color:#fff;display:none;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;box-shadow:0 2px 6px rgba(74,144,217,0.3)}
.topbar .back{font-size:20px;cursor:pointer;width:32px;text-align:left}
.topbar .title{font-size:16px;font-weight:600}
.topbar .right{width:60px;text-align:right}
.page{display:none;min-height:100vh;padding-top:52px}
.page.active{display:block}
.home-hero{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:40px 24px 32px;text-align:center}
.home-hero h1{font-size:22px;margin-bottom:8px}
.home-hero p{font-size:13px;opacity:.85}
.home-hero .stats{display:flex;justify-content:center;gap:24px;margin-top:18px}
.home-hero .stat-item{text-align:center}
.home-hero .stat-item .num{font-size:24px;font-weight:700}
.home-hero .stat-item .label{font-size:11px;opacity:.7;margin-top:2px}
.home-section{padding:16px}
.home-section h2{font-size:15px;color:var(--text);margin-bottom:12px;padding-left:4px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode-card{background:var(--card-bg);border-radius:12px;padding:20px 16px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.mode-card:active{transform:scale(.96)}
.mode-card .icon{font-size:32px;margin-bottom:8px}
.mode-card .name{font-size:14px;font-weight:600;color:var(--text)}
.mode-card .desc{font-size:11px;color:var(--text-secondary);margin-top:4px}
.exam-config{background:var(--card-bg);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.exam-config label{font-size:13px;color:var(--text);display:block;margin-bottom:6px}
.exam-config select,.exam-config input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text)}
.exam-config .row{display:flex;gap:12px;margin-bottom:12px}
.exam-config .row>div{flex:1}
.exam-config .btn{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.exam-config .btn:active{background:var(--primary-dark)}
.search-box{margin-bottom:16px}
.search-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:20px;font-size:14px;background:#fff}
.quiz-header{background:var(--card-bg);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:52px;z-index:50}
.quiz-progress-text{font-size:13px;color:var(--text-secondary)}
.quiz-progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;margin:0 12px;overflow:hidden}
.quiz-progress-bar .fill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
.quiz-card{background:var(--card-bg);margin:12px;border-radius:12px;padding:20px 16px;box-shadow:var(--shadow)}
.q-tag{display:inline-block;font-size:11px;color:var(--primary);background:var(--primary-light);padding:2px 8px;border-radius:4px;margin-bottom:10px}
.q-tag.wrong-tag{color:var(--wrong);background:var(--wrong-bg)}
.q-text{font-size:16px;font-weight:600;line-height:1.7;margin-bottom:18px}
.option-list{display:flex;flex-direction:column;gap:10px}
.option-item{display:flex;align-items:flex-start;padding:14px 14px;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s}
.option-item:active{transform:scale(.98)}
.option-item .letter{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;margin-right:12px;color:var(--text-secondary);transition:all .2s}
.option-item .text{font-size:14px;line-height:1.6;flex:1;padding-top:3px}
.option-item.selected{border-color:var(--primary);background:var(--primary-light)}
.option-item.selected .letter{border-color:var(--primary);background:var(--primary);color:#fff}
.option-item.correct{border-color:var(--correct);background:var(--correct-bg)}
.option-item.correct .letter{border-color:var(--correct);background:var(--correct);color:#fff}
.option-item.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.option-item.wrong .letter{border-color:var(--wrong);background:var(--wrong);color:#fff}
.option-item.disabled{cursor:default}
.quiz-actions{display:flex;gap:12px;padding:0 12px;margin-top:16px;margin-bottom:30px}
.quiz-actions button{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--card-bg);color:var(--text);cursor:pointer}
.quiz-actions button:active{background:var(--bg)}
.quiz-actions button:disabled{opacity:.4}
.quiz-actions .next-btn{background:var(--primary);color:#fff;border:none;font-weight:600}
.feedback{margin:16px 0 0;padding:12px 16px;border-radius:8px;font-size:14px;display:none}
.feedback.show{display:block}
.feedback.correct{background:var(--correct-bg);color:var(--correct)}
.feedback.wrong{background:var(--wrong-bg);color:var(--wrong)}
.feedback .answer-text{font-weight:600}
.submit-bar{display:none;position:fixed;bottom:0;left:0;right:0;padding:14px 16px;background:var(--card-bg);box-shadow:0 -2px 8px rgba(0,0,0,.1);z-index:80}
.submit-bar.show{display:block}
.submit-bar button{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.result-card{background:var(--card-bg);margin:16px;border-radius:12px;padding:24px;box-shadow:var(--shadow);text-align:center}
.result-score{font-size:48px;font-weight:700;color:var(--primary)}
.result-info{font-size:14px;color:var(--text-secondary);margin-top:8px}
.result-stats{display:flex;justify-content:space-around;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.result-stats .item{text-align:center}
.result-stats .item .num{font-size:20px;font-weight:700}
.result-stats .item .label{font-size:12px;color:var(--text-secondary);margin-top:4px}
.result-stats .item .num.green{color:var(--correct)}
.result-stats .item .num.red{color:var(--wrong)}
.result-actions{padding:0 16px;margin-top:20px;display:flex;gap:12px}
.result-actions button{flex:1;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.result-actions .review{background:var(--card-bg);border:1px solid var(--border);color:var(--text)}
.result-actions .home{background:var(--primary);color:#fff;border:none}
.fav-list,.search-list{padding:12px}
.fav-item{background:var(--card-bg);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.fav-item .q-preview{font-size:14px;font-weight:500;line-height:1.5}
.fav-item .q-meta{font-size:12px;color:var(--text-secondary);margin-top:6px;display:flex;justify-content:space-between}
.fav-item .q-meta .tag{color:var(--primary)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.empty-state .icon{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-state p{font-size:14px}
.bookmark-btn{position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:22px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(74,144,217,.4);cursor:pointer;z-index:60;transition:transform .2s}
.bookmark-btn:active{transform:scale(.9)}
.bookmark-btn.active{background:#FFB400}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.swipe-hint{text-align:center;font-size:12px;color:var(--text-secondary);padding:8px;opacity:.5}
@media(max-width:380px){.mode-grid{grid-template-columns:1fr}.quiz-card{padding:16px 12px}.q-text{font-size:15px}}
</style>
</head>
<body>
<div class="topbar" id="topbar">
<div class="back" id="btn-home">&#8592;</div>
<div class="title" id="topbar-title">刷题</div>
<div class="right" id="topbar-right"></div>
</div>

<div class="stats">

<script>

function prevQuestion(){if(state.current>0){state.current--;renderQuestion()}}
function toggleBookmark(){var qi=state.indices[state.current];var idx=state.favQuestions.indexOf(qi);if(idx===-1){state.favQuestions.push(qi);showToast('已收藏')}else{state.favQuestions.splice(idx,1);showToast('已取消收藏')}saveState();renderQuestion()}
function doSearch(){var kw=document.getElementById('search-input').value.trim().toLowerCase();var c=document.getElementById('search-results');if(!kw){c.innerHTML='';return}var r=[];for(var i=0;i<QUESTIONS.length;i++){if(QUESTIONS[i].question.toLowerCase().indexOf(kw)!==-1)r.push(i)}if(r.length===0){c.innerHTML='<div class="empty-state"><div class="icon">&#128269;</div><p>未找到相关题目</p></div>';return}var h='';for(var ri=0;ri<Math.min(r.length,50);ri++){var qi2=r[ri];var q2=QUESTIONS[qi2];var pv=q2.question.length>60?q2.question.substring(0,60)+'...':q2.question;h+='<div class="fav-item" data-jump="'+qi2+'"><div class="q-preview">'+pv+'</div><div class="q-meta"><span class="tag">' +(q2.multi?'多选':'单选')+' · 第'+(qi2+1)+'题</span><span>点击查看 →</span></div></div>'}if(r.length>50){h+='<div style="text-align:center;padding:10px;color:var(--text-secondary);font-size:12px">共'+r.length+'条结果，仅显示前50条</div>'}c.innerHTML=h}
function jumpToQuestion(qi){state.mode='order';state.exam=false;state.selected={};state.answered={};state.current=0;state.indices=[qi];document.getElementById('topbar-title').textContent='题目预览';document.getElementById('topbar-right').textContent='';showPage('page-quiz');renderQuestion();document.getElementById('bookmark-btn').style.display='flex'}
document.addEventListener('click',function(e){var t=e.target;var hb=t.closest('#btn-home');if(hb){goHome();return}var mc=t.closest('[data-action]');if(mc){var a=mc.getAttribute('data-action');if(a==='practice-order')startPractice('order');else if(a==='practice-random')startPractice('random');else if(a==='wrong-mode')showWrongMode();else if(a==='fav-mode')showFavMode();return}if(t.closest('#btn-reset')){if(confirm('确定要重置所有进度吗？\n\n这将清除：已做题目、错题本、收藏夹、正确率统计\n\n此操作不可撤销！')){localStorage.removeItem('ywqt_state');state.wrongQuestions=[];state.favQuestions=[];state.doneQuestions=[];state.correctCount=0;state.totalCount=0;updateHomeStats();showToast('进度已重置');setTimeout(function(){location.reload()},800)}return}
if(t.closest('#btn-start-exam')){startExam();return}if(t.closest('#btn-submit-exam')){submitExam();return}if(t.closest('#btn-review')){reviewExam();return}if(t.closest('#btn-result-home')){goHome();return}if(t.closest('#prev-btn')){prevQuestion();return}if(t.closest('#next-btn')){nextQuestion();return}if(t.closest('#bookmark-btn')){toggleBookmark();return}var op=t.closest('.option-item');if(op){var l=op.getAttribute('data-letter');if(l)selectOption(l);return}var ji=t.closest('[data-jump]');if(ji){var qi=parseInt(ji.getAttribute('data-jump'),10);jumpToQuestion(qi);return}});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='search-input')doSearch()});
var tsx=0;document.addEventListener('touchstart',function(e){if(e.changedTouches&&e.changedTouches[0])tsx=e.changedTouches[0].screenX},{passive:true});document.addEventListener('touchend',function(e){if(!e.changedTouches||!e.changedTouches[0])return;var tex=e.changedTouches[0].screenX;var d=tsx-tex;var qp=document.getElementById('page-quiz');if(!qp.classList.contains('active'))return;if(Math.abs(d)<60)return;var t=e.target;if(t.closest&&t.closest('.option-item'))return;if(d>0)nextQuestion();else prevQuestion()},{passive:true});
try{loadState();updateHomeStats()}catch(e){document.body.innerHTML='<div style="padding:20px;text-align:center;color:red">JS错误: '+e.message+'</div>'}
</script>
</body>
</html>
